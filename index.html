<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạp Hóa Ái Cử</title>
    
    <!-- Dòng này dùng để thay đổi logo trên tab trình duyệt (Favicon) -->
    <link rel="icon" href="logo.png" type="image/png" />
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3c72">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tạp Hóa">
    <link rel="apple-touch-icon" href="logo.png">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style-index.css" />
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
  </head>
  <body>
    <nav class="d-flex justify-content-between align-items-center p-3 shadow-sm bg-white">
      <div class="logo d-flex align-items-center">
        <!-- Đã thay thế icon bằng logo.jpg -->
        <img src="logo.png" alt="Logo Tạp Hóa" style="height: 40px; width: 40px; object-fit: cover; border-radius: 50%; margin-right: 10px;">
        <span class="fw-bold fs-5 text-primary">TẠP HÓA ÁI CỬ</span>
      </div>
      <a href="admin.html" class="btn-admin text-decoration-none">⚙️ Quản Lý</a>
    </nav>

    <div class="container-fluid py-4 main-content">
      <div class="row g-4">
        <section class="col-12 left-side">
          <div class="banner-slider mb-4">
            <img class="slide" src="https://images.unsplash.com/photo-1604719312566-8fa20658f1e1?auto=format&fit=crop&q=80&w=1000&h=300" alt="Khuyến mãi 1" />
            <img class="slide" src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=1000&h=300" alt="Khuyến mãi 2" />
            <div class="banner-overlay">Khuyến Mãi Hôm Nay 🔥</div>
          </div>

          <div class="search-container mb-4">
            <input type="text" id="search" class="form-control form-control-lg rounded-pill shadow-sm" placeholder="🔍 Tìm kiếm sản phẩm" oninput="renderProducts()" />
          </div>

          <div id="productGrid" class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3"></div>
        </section>
      </div>
    </div> <button class="cart-floating-btn" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
      🛒 <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.85rem;">0</span>
    </button>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
      <div class="offcanvas-header border-bottom">
        <h4 class="offcanvas-title text-primary fw-bold" id="cartOffcanvasLabel">🛒 Giỏ hàng</h4>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        
        <div id="cartItems" class="cart-list mb-3 overflow-auto" style="flex: 1;"></div>

        <div class="total-box d-flex justify-content-between align-items-center bg-light p-3 rounded-3 mb-3">
          <span class="fw-bold text-secondary">Tổng tiền:</span>
          <span id="totalText" class="total-price text-danger fs-3 fw-bold">0đ</span>
        </div>

       <div class="payment-actions">
          <p class="text-center fw-bold text-secondary mb-3">Chọn phương thức thanh toán</p>
          
          <button id="btnDatHang" class="btn w-100 mb-2 py-3 fw-bold text-dark" style="display: none; background: linear-gradient(135deg, #f1c40f, #f39c12); border:none;" onclick="openOrderModal()">📦 ĐẶT HÀNG GIAO TẬN NƠI</button>
          
          <button id="btnTienMat" class="btn btn-success w-100 mb-2 py-3 fw-bold" onclick="handlePay('Tiền mặt')">💵 TIỀN MẶT</button>
          <button id="btnQR" class="btn btn-primary w-100 py-3 fw-bold" onclick="showQR()">🖼️ QUYÉT MÃ QR</button>
        </div>

      </div>
    </div>
    </div>

    <div id="qrModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Quét mã để thanh toán</h3>
        </div>
        <p id="qrInfo" class="qr-info-text"></p>
        <div class="qr-image-wrapper">
          <img id="qrImg" src="" alt="VietQR" />
        </div>
        <div class="qr-memo-box">
          <span>Nội dung chuyển khoản:</span>
          <b id="qrMemo"></b>
        </div>
        <div class="modal-btns">
          <button class="btn-confirm-pay" onclick="handlePay('Chuyển khoản')">
            XÁC NHẬN ĐÃ CHUYỂN
          </button>
          <button class="btn-close-modal" onclick="closeQR()">HỦY</button>
        </div>
      </div>
    </div>
    <div id="orderModal" class="modal">
      <div class="modal-content" style="max-width: 450px; text-align: left;">
        <div class="modal-header d-flex justify-content-between align-items-center mb-3">
          <h3 style="margin:0; font-size: 1.3rem; color: #1e3c72;">📦 THÔNG TIN ĐẶT HÀNG</h3>
          <button type="button" class="btn-close" onclick="closeOrderModal()"></button>
        </div>
        <form id="orderForm" onsubmit="submitOrder(event)">
          <div class="mb-3">
            <label class="form-label fw-bold">Họ và tên:</label>
            <input type="text" id="cusName" class="form-control" required placeholder="Nhập tên người nhận">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Số điện thoại:</label>
            <input type="tel" id="cusPhone" class="form-control" required placeholder="Số điện thoại liên hệ">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Địa chỉ giao hàng:</label>
            <textarea id="cusAddress" class="form-control" rows="2" required placeholder="Nhập số nhà, tên đường, khu vực..."></textarea>
          </div>
          <div class="bg-light p-3 rounded mb-3 text-center border">
            <span class="fw-bold">Tổng thanh toán (Khi nhận hàng):</span><br>
            <span id="orderModalTotal" class="fs-4 fw-bold text-danger">0đ</span>
          </div>
          <button type="submit" class="btn w-100 fw-bold py-2 text-dark" style="background: linear-gradient(135deg, #f1c40f, #f39c12); border:none;">XÁC NHẬN ĐẶT HÀNG</button>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script-index.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service Worker Đã Đăng Ký!"))
          .catch(err => console.log("Lỗi Service Worker: ", err));
      }
    </script>
  </body>
</html>
